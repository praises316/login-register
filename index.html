<!-- REGISTER:
=========
fullname, email, phone, password, date of birth.
1. Validate all the data.
2. User must submit a valid email address.
3. Password must be greater than 7 characters and it should consist of lowercase, uppercase, number, symbol (optional)
4. For date of birth, the user must be above 18 years.
5. Show the user information after successful validation

LOGIN:
=======
Hard-code the email and password.

1. Validate all data
2. Check if the credentials are correct
3. If correct, show the user a successful message.  -->







<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registration and Login</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f5f5f5;
      padding: 40px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 40px;
    }

    .form-section {
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
      width: 350px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    input {
      display: block;
      margin: 10px 0;
      padding: 10px;
      width: 100%;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }

    button {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 12px;
      width: 100%;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #45a049;
    }

    .result {
      margin-top: 15px;
      color: green;
      font-size: 14px;
    }

    .error {
      color: red;
      font-size: 14px;
    }

    ul {
      padding-left: 20px;
    }

    li {
      margin-bottom: 5px;
    }
    
  </style>
</head>
<body>
  <div class="form-section">
    <h2>Students Registration Form</h2>
    <input type="text" id="regName" placeholder="Full Name" />
    <input type="email" id="regEmail" placeholder="Email" />
    <input type="number" id="phhoneNumber" placeholder="Number">
    
    <!-- Add Show Password button here -->
    <input type="password" id="regPassword" placeholder="Password" />
    <button id="showPass" type="button">Show Password</button>
    
    <input type="date" id="regDob" placeholder="Date of Birth" />

    <button onclick="register()">Register</button>
    <div id="result" class="result"></div>
  </div>

  <div class="form-section">
    <h2>Login Form</h2>
    <input type="email" id="loginEmail" placeholder="Email" />
    <input type="password" id="loginPassword" placeholder="Password" />
    <button onclick="login()">Login</button>
    <div id="loginResult" class="result"></div>
  </div>
  <footer style="text-align: center; margin-top: 20px;">
    <p>Check out my projects on <a href="https://github.com/praises316" target="_blank" style="color: #4CAF50; text-decoration: none;">GitHub</a>.</p>
  </footer>

  <script>
    let registeredUser = {}; 

    // Show or hide password
    document.getElementById("showPass").addEventListener("click", function () {
      const passwordField = document.getElementById("regPassword");
      const showBtn = document.getElementById("showPass");

      if (passwordField.type === "password") {
        passwordField.type = "text";
        showBtn.innerText = "Hide Password";
      } else {
        passwordField.type = "password";
        showBtn.innerText = "Show Password";
      }
    });

    function register() {
      const fullname = document.getElementById("regName").value;
      const email = document.getElementById("regEmail").value;
      const password = document.getElementById("regPassword").value;
      const dob = document.getElementById("regDob").value;

      if (!fullname || !email || !password || !dob) {
        document.getElementById("result").innerHTML =
          "<p class='error'>Please fill in all fields.</p>";
        return;
      }

      // Save registered data
      registeredUser = {
        fullname,
        email,
        password,
        dob,
      };

      document.getElementById("result").innerHTML = `
        <h3>Registration Successful</h3>
        <ul>
          <li><strong>Name:</strong> ${fullname}</li>
          <li><strong>Email:</strong> ${email}</li>
          <li><strong>Password:</strong> ${password}</li>
          <li><strong>Date of Birth:</strong> ${dob}</li>
        </ul>
      `;

      // detail collected and stored on registeration
      document.getElementById("regName").value = "";
      document.getElementById("regEmail").value = "";
      document.getElementById("regPassword").value = "";
      document.getElementById("regDob").value = "";
    }

    function login() {
      const email = document.getElementById("loginEmail").value;
      const password = document.getElementById("loginPassword").value;

      if (!email || !password) {
        document.getElementById("loginResult").innerHTML =
          "<p class='error'>Please enter email and password.</p>";
        return;
      }

      if (
        email === registeredUser.email &&
        password === registeredUser.password
      ) {
        document.getElementById("loginResult").innerHTML = `
          <h3>Login Successful</h3>
          <p>Welcome, ${registeredUser.fullname}!</p>
        `;
      } else {
        document.getElementById("loginResult").innerHTML =
          "<p class='error'>Invalid email or password.</p>";
      }

      // data used to validate login form
      document.getElementById("loginEmail").value = "";
      document.getElementById("loginPassword").value = "";
    }
  </script>
</body>
</html>
